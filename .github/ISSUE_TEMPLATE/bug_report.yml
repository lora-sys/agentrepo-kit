name: Bug report
description: Report a reproducible bug
labels: [bug]
body:
  - type: textarea
    id: issue
    attributes:
      label: 问题描述
      description: 具体发生了什么？预期行为是什么？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 给出可重复执行的命令、文件结构和必要输入。
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js 版本
      placeholder: v22.x
  - type: textarea
    id: checks
    attributes:
      label: 已执行的检查和输出
      description: 请删除密钥和敏感信息。不能执行的检查请说明原因。
