name: Bug report
description: Report a reproducible failure in AgentRepo Kit
body:
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 请提供实际错误，并删除个人数据和凭据。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 提供初始化命令、仓库结构及可重复的步骤。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统及版本
      placeholder: Ubuntu 24.04, Node 22, AgentRepo Kit 0.7.0
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: 测试与日志
      description: 可以贴最小 Eval 样例，但不能包含密钥。
