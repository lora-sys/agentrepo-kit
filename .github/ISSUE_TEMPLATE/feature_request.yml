name: Feature request
description: Suggest a testable improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的具体问题
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 预期行为与验收条件
      description: 描述可以独立核验的结果。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 对已有仓库兼容性的影响
  - type: textarea
    id: eval
    attributes:
      label: Eval 复现与验收方法
