<body>
<header><div><div class="eyebrow">AgentRepo Kit · Architecture explorer</div><div class="title" id="projectName">项目架构</div><div class="subtitle">源码清单由 CLI 生成，模块依赖仅来自经过解析的源文件依赖</div></div><div class="metrics"><div class="metric"><strong id="moduleCount">0</strong>模块</div><div class="metric"><strong id="fileCount">0</strong>源文件</div><div class="metric"><strong id="edgeCount">0</strong>已解析跨模块依赖</div></div></header>
<main class="wrapper"><div id="notice" class="notice"></div><div class="columns"><section class="panel"><h2>模块索引</h2><div class="panelbody"><input id="search" class="search" type="search" placeholder="搜索模块与文件" aria-label="搜索模块与文件"><div id="moduleList"></div></div></section><section class="panel"><h2>真实依赖关系</h2><div id="graphArea"></div><div class="graphNote" id="graphNote"></div></section><section class="panel details"><h2>模块详情</h2><div id="details">选择左侧模块查看源文件与相关依赖。</div></section></div><footer>Generated by AgentRepo CLI. 修改源码后运行 agentrepo arch view --write 更新。业务解释见 architecture.md。</footer></main>
<script type="application/json" id="graphData">{"schemaVersion":1,"project":"agentrepo-visual-demo","fileCount":7,"fingerprint":"636f1a42463315f2a4930bd696a62215e67ff46d2c4b1b0ee176824a07c210ae","mode":"dependency-cruiser","modules":[{"id":"(root)","files":["depcruise-fixture.json"]},{"id":"src/api","files":["src/api/routes.js"]},{"id":"src/auth","files":["src/auth/session.js"]},{"id":"src/data","files":["src/data/users.js"]},{"id":"src/ui","files":["src/ui/form.js"]},{"id":"src/utils","files":["src/utils/crypto.js"]},{"id":"web","files":["web/app.html"]}],"edges":[{"from":"src/api","to":"src/auth","count":1,"examples":["src/api/routes.js → src/auth/session.js"]},{"from":"src/auth","to":"src/data","count":1,"examples":["src/auth/session.js → src/data/users.js"]},{"from":"src/auth","to":"src/utils","count":1,"examples":["src/auth/session.js → src/utils/crypto.js"]},{"from":"src/ui","to":"src/auth","count":1,"examples":["src/ui/form.js → src/auth/session.js"]}]}</script>
<script>
(() => {
'use strict';
const data=JSON.parse(document.getElementById('graphData').textContent);
const $=id=>document.getElementById(id);
const modules=new Map(data.modules.map(x=>[x.id,x]));
let selected=null;let filter='';
$('projectName').textContent=data.project;
$('moduleCount').textContent=data.modules.length;
$('fileCount').textContent=data.fileCount;
$('edgeCount').textContent=data.edges.length;
$('notice').textContent=data.mode==='dependency-cruiser'
  ? '依赖分析已完成。箭头只表示 dependency-cruiser 实际解析出的跨模块依赖。点击节点或左侧模块查看来源文件。'
  : '当前为文件清单视图，尚未验证代码依赖。安装 dependency-cruiser 后运行 agentrepo arch view --write 才会绘制真实连线。';
const matches=m=>!filter||m.id.toLowerCase().includes(filter)||m.files.some(f=>f.toLowerCase().includes(filter));
function tag(parent,name,attrs={},text){const e=document.createElement(name);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));if(text!==undefined)e.textContent=String(text);parent.appendChild(e);return e;}
function renderList(){const host=$('moduleList');host.replaceChildren();let shown=0;for(const m of data.modules){if(!matches(m))continue;shown++;const button=tag(host,'button',{type:'button',class:'module'+(selected===m.id?' selected':'')});tag(button,'span',{class:'dot'});const section=tag(button,'span');tag(section,'span',{class:'name'},m.id);tag(section,'small',m.files.length+' 个文件');button.onclick=()=>{selected=selected===m.id?null:m.id;render();};}if(!shown)tag(host,'div',{class:'muted'},'没有匹配的模块');}
function renderDetails(){const host=$('details');host.replaceChildren();const m=modules.get(selected);if(!m){tag(host,'p',{class:'muted'},'点击模块查看源文件、入站与出站依赖。');return;}tag(host,'div',{class:'detailsName'},m.id);tag(host,'p',{class:'muted'},m.files.length+' 个真实源码文件');
const out=data.edges.filter(e=>e.from===m.id);const incoming=data.edges.filter(e=>e.to===m.id);
for(const [title,list,mapper] of [['出站依赖',out,e=>e.to],['入站依赖',incoming,e=>e.from]]){tag(host,'div',{class:'label'},title+' · '+list.length);if(!list.length)tag(host,'div',{class:'muted'},'暂无可验证的依赖');else for(const dep of list){const el=tag(host,'div',{class:'dep'},mapper(dep)+' · '+dep.count+' 处引用');el.title=dep.examples.join('\n');}}
tag(host,'div',{class:'label'},'源码');for(const f of m.files.slice(0,100))tag(host,'div',{class:'file'},f);if(m.files.length>100)tag(host,'div',{class:'muted'},'还有 '+(m.files.length-100)+' 个文件未展开');}
const NS='http://www.w3.org/2000/svg';function sv(parent,type,attributes){const e=document.createElementNS(NS,type);for(const [k,v] of Object.entries(attributes))e.setAttribute(k,String(v));parent.appendChild(e);return e;}
function renderGraph(){const host=$('graphArea');host.replaceChildren();if(data.mode!=='dependency-cruiser'){const empty=tag(host,'div',{class:'empty'});tag(empty,'strong',{},'尚无已验证的依赖');tag(empty,'span',{},'左侧仍可查看模块和实际文件');$('graphNote').textContent='未安装依赖分析工具时，不创建推测性连线。';return;}
let relevant=data.edges.filter(e=>selected?e.from===selected||e.to===selected:(!filter||modules.has(e.from)&&matches(modules.get(e.from))||modules.has(e.to)&&matches(modules.get(e.to))));
const total=relevant.length;relevant=relevant.slice(0,65);if(!relevant.length){tag(host,'div',{class:'empty'},'当前筛选下没有跨模块依赖');$('graphNote').textContent='仅展示跨模块依赖；同一模块内部引用不绘制。';return;}
const left=[...new Set(relevant.map(e=>e.from))],right=[...new Set(relevant.map(e=>e.to))];const H=Math.max(350,70*Math.max(left.length,right.length)+60);const svg=sv(host,'svg',{id:'graph',viewBox:'0 0 900 '+H,role:'img','aria-label':'依据源码分析绘制的模块依赖图'}); const defs=sv(svg,'defs',{}); const marker=sv(defs,'marker',{id:'arrow',markerWidth:7,markerHeight:7,refX:5,refY:3,orient:'auto',markerUnits:'strokeWidth'});sv(marker,'path',{d:'M 0 0 L 6 3 L 0 6 z',fill:'#8797b7'});
const coords={};left.forEach((id,i)=>coords['L'+id]=65+(i+1)*((H-110)/(left.length+1)));right.forEach((id,i)=>coords['R'+id]=65+(i+1)*((H-110)/(right.length+1)));
for(let i=0;i<relevant.length;i++){const e=relevant[i];const y1=coords['L'+e.from],y2=coords['R'+e.to];const g=sv(svg,'path',{d:`M 340 ${y1} C 445 ${y1}, 455 ${y2}, 560 ${y2}`,stroke:['#5f7ee6','#08a49d','#e58a4f','#9468c8'][left.indexOf(e.from)%4],'stroke-width':selected?2.6:1.6,opacity:.63,fill:'none','marker-end':'url(#arrow)'});const title=sv(g,'title',{});title.textContent=e.from+' → '+e.to+' · '+e.count+' 次引用';}
for(const [ids,key,x] of [[left,'L',30],[right,'R',560]])for(const id of ids){const y=coords[key+id]-23;const group=sv(svg,'g',{tabindex:0,role:'button','aria-label':'查看模块 '+id});sv(group,'rect',{x,y,width:310,height:46,rx:8,fill:selected===id?'#eef3ff':'#ffffff',stroke:selected===id?'#7d99ef':'#dfe6ef'});const t=sv(group,'text',{x:x+12,y:y+19,fill:'#293b57','font-size':13,'font-weight':700});t.textContent=id.length>37?id.slice(0,35)+'…':id;const subt=sv(group,'text',{x:x+12,y:y+35,fill:'#8291a6','font-size':10});subt.textContent=(modules.get(id)?.files.length??0)+' 个文件';group.style.cursor='pointer';group.addEventListener('click',()=>{selected=id;render();});group.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();selected=id;render();}});}
$('graphNote').textContent=`显示 ${relevant.length} / ${total} 条跨模块依赖。点击模块后聚焦其上下游。`;}
function render(){renderList();renderDetails();renderGraph();}
$('search').addEventListener('input',e=>{filter=e.target.value.trim().toLowerCase();render();});render();
})();
</script>
