name: AgentRepo template update check

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  check-upstream-template:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      # Replace with the upstream commit SHA that matches the accepted baseline.
      BASE_TEMPLATE_SHA: "__SET_UPSTREAM_TEMPLATE_SHA__"
    steps:
      - name: Compare upstream AGENTS template
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$BASE_TEMPLATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error title=Configuration required::Set BASE_TEMPLATE_SHA to the accepted upstream template commit.'
            exit 2
          fi

          api_url='https://api.github.com/repos/lora-sys/agentrepo-kit/commits?path=templates%2Fproject%2FAGENTS.md&per_page=1'
          latest_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api_url" | jq -er '.[0].sha // empty')"
          if [[ ! "$latest_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::GitHub returned an invalid upstream commit SHA.'
            exit 2
          fi

          if [[ "$latest_sha" == "$BASE_TEMPLATE_SHA" ]]; then
            echo 'The upstream AGENTS template has no newer source commit.'
            exit 0
          fi

          base_file="$RUNNER_TEMP/agentrepo-template-base.md"
          latest_file="$RUNNER_TEMP/agentrepo-template-latest.md"
          diff_file="$RUNNER_TEMP/agentrepo-template.diff"
          raw_base="https://raw.githubusercontent.com/lora-sys/agentrepo-kit/$BASE_TEMPLATE_SHA/templates/project/AGENTS.md"
          raw_latest="https://raw.githubusercontent.com/lora-sys/agentrepo-kit/$latest_sha/templates/project/AGENTS.md"
          curl -fsSL "$raw_base" -o "$base_file"
          curl -fsSL "$raw_latest" -o "$latest_file"

          set +e
          diff -u "$base_file" "$latest_file" > "$diff_file"
          diff_status=$?
          set -e

          if [[ "$diff_status" == 0 ]]; then
            echo 'The upstream source advanced, but the AGENTS template content is unchanged.'
            exit 0
          fi
          if [[ "$diff_status" != 1 ]]; then
            echo '::error::Could not compare upstream template contents.'
            exit 2
          fi

          echo '::error title=AgentRepo template changed::Review the diff below; this workflow never updates AGENTS.md.'
          {
            echo '## AgentRepo AGENTS template update available'
            echo "Pinned: \`$BASE_TEMPLATE_SHA\` · Latest: \`$latest_sha\`"
            echo 'This workflow is read-only. Review and apply any change manually.'
            echo ''
            echo '```diff'
            cat "$diff_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
